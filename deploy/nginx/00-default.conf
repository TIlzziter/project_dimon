# /etc/nginx/sites-available/00-default.conf (+ симлинк в sites-enabled)
# Неизвестные имена / обращение по IP: 80 — закрыть соединение (444), 443 — оборвать TLS-рукопожатие.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

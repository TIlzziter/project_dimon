# /etc/nginx/sites-available/duty-journal.conf (+ симлинк в sites-enabled)
# Сертификат: certbot certonly --nginx (Let's Encrypt), продление — certbot.timer (+ reload nginx через deploy-hook).
limit_req_zone $binary_remote_addr zone=dj_login:1m rate=10r/m;

# HTTP: ACME-проверки и редирект на HTTPS
server {
    listen 80;
    server_name duty-journal.nicholas-the-great.xyz nicholas-the-great.xyz www.nicholas-the-great.xyz;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# Корень и www временно ведут на журнал
server {
    listen 443 ssl http2;
    server_name nicholas-the-great.xyz www.nicholas-the-great.xyz;
    ssl_certificate     /etc/letsencrypt/live/duty-journal.nicholas-the-great.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duty-journal.nicholas-the-great.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 302 https://duty-journal.nicholas-the-great.xyz/;
}

server {
    listen 443 ssl http2;
    server_name duty-journal.nicholas-the-great.xyz;
    ssl_certificate     /etc/letsencrypt/live/duty-journal.nicholas-the-great.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duty-journal.nicholas-the-great.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/duty-journal.access.log;
    error_log  /var/log/nginx/duty-journal.error.log;

    client_max_body_size 2m;   # загрузок файлов в журнале нет, только формы
    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_read_timeout 60s;

    location = /login {
        limit_req zone=dj_login burst=10 nodelay;   # ограничение подбора пароля
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
